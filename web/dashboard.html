<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Agent Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="login-brand"><span class="mark">H&amp;K</span><div><strong>Harbor &amp; Key Realty</strong><span>AI Sales Agent · staff dashboard</span></div></div>
    <label>Password<input type="password" id="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Log in</button>
    <p id="login-error" class="error"></p>
    <p class="hint">Demo password: set <code>ADMIN_PASSWORD</code> in <code>.env</code> (default <code>demo1234</code>).</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-brand"><span class="mark">H&amp;K</span><div><strong>Harbor &amp; Key</strong><span>AI Sales Agent</span></div></div>
    <nav id="nav">
      <a href="#/overview" data-page="overview"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/></svg>Overview</a>
      <a href="#/leads" data-page="leads"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.7 0-8 1.3-8 4v3h8v-3c0-1.1.4-2.1 1.2-3A11 11 0 0 0 8 13zm8 0c-2.7 0-8 1.3-8 4v3h16v-3c0-2.7-5.3-4-8-4z"/></svg>Leads</a>
      <a href="#/conversations" data-page="conversations"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg>Conversations<span class="count" id="waiting-count" hidden></span></a>
      <a href="#/viewings" data-page="viewings"><svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zm-2 8h14v10H5z"/></svg>Viewings</a>
      <a href="#/knowledge" data-page="knowledge"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zm8 1v5h5"/></svg>Knowledge base</a>
      <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4zm9 5v-2l-2.2-.4a7 7 0 0 0-.7-1.7l1.3-1.8-1.4-1.4-1.8 1.3a7 7 0 0 0-1.7-.7L14 3h-2l-.4 2.2a7 7 0 0 0-1.7.7L8.1 4.6 6.7 6l1.3 1.8a7 7 0 0 0-.7 1.7L5 10v2l2.2.4a7 7 0 0 0 .7 1.7l-1.3 1.8 1.4 1.4 1.8-1.3a7 7 0 0 0 1.7.7L12 21h2l.4-2.2a7 7 0 0 0 1.7-.7l1.8 1.3 1.4-1.4-1.3-1.8a7 7 0 0 0 .7-1.7z"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <a class="btn small" href="/" target="_blank">Open customer chat ↗</a>
      <button class="btn small" id="logout">Log out</button>
    </div>
  </aside>
  <main class="main">
    <div id="banner" class="banner" hidden></div>
    <div id="page"></div>
  </main>
</div>
<script src="/static/dashboard.js"></script>
</body>
</html>
