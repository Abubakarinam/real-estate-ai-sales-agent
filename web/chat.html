<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor &amp; Key Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<div class="chat">
  <header class="chat-head">
    <span class="mark">H&amp;K</span>
    <div class="who">
      <strong>Harbor &amp; Key Assistant</strong>
      <span id="status-line"><span class="dot live"></span> Replies in seconds · English / العربية</span>
    </div>
    <button class="icon-btn" id="new-chat" title="Start a new chat" aria-label="Start a new chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </header>
  <main id="log" class="log" aria-live="polite"></main>
  <div id="chips" class="chips"></div>
  <form id="composer" class="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Type your message… / اكتب رسالتك" dir="auto" maxlength="2000"></textarea>
    <button class="send" id="send" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="fine">AI assistant · demo agency with sample listings · a consultant can join anytime</p>
</div>
<script src="/static/chat.js"></script>
</body>
</html>
